[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "aworld-cli"
version = "1.0.0a1"
description = "Thin command-line wrapper for AWorld"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["aworld==1.0.0a1"]

[project.optional-dependencies]
llm = ["aworld[llm]==1.0.0a1"]
skills = ["aworld[skills]==1.0.0a1"]

[project.scripts]
aworld-cli = "aworld_cli.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aworld_cli"]
